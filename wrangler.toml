#:schema node_modules/wrangler/config-schema.json
#
# MINIMAL BY DESIGN.
#
# Every setting with a sensible default now lives in src/worker/config/env.ts
# instead of here, so this file only contains what actually has to be declared.
# Nothing below is a placeholder you must edit to deploy.
#
# The one thing you MUST set is the SIGNING_KEY secret (see the bottom of this
# file). Without it the Worker refuses to start, deliberately: that key is what
# stops the stream proxy being an open relay for the whole internet.

name = "media-fetch"   # must match the Worker name your CI expects
main = "src/worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# REQUIRED. Serves the built client. Anything that is not a static asset falls
# through to the Worker (the /api/* routes).
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# OPTIONAL EXTRAS — all commented out. Uncomment only what you want.
#
# Check what is live at any time with:  curl https://<worker>/api/health
# ---------------------------------------------------------------------------

# --- In-browser muxing: NOTHING TO CONFIGURE ------------------------------
#
# The muxer works out of the box. ffmpeg.wasm is ~31 MiB, over the 25 MiB
# per-asset limit, so `npm run vendor:ffmpeg` (which postinstall runs) splits it
# into 10 MiB parts under public/vendor/ffmpeg/ and the browser reassembles them.
#
# The R2 binding below is an OPTIONAL ALTERNATIVE for keeping the ~31 MiB out of
# your asset bundle. Cloudflare already skips unchanged assets on redeploy, so
# most deployments do not need it.
#
#   npx wrangler r2 bucket create mediafetch-vendor
#   npm run upload:ffmpeg
#
# [[r2_buckets]]
# binding = "FFMPEG_BUCKET"
# bucket_name = "mediafetch-vendor"

# --- Response cache + per-IP rate limiting ---------------------------------
#
#   npx wrangler kv namespace create CACHE
#   npx wrangler kv namespace create CACHE --preview
#
# Paste BOTH returned ids below. A placeholder id does not degrade gracefully —
# it fails the deploy outright with error 10042.
#
# Without this, every resolve re-extracts (slower, more upstream traffic) and the
# rate limiter fails open.
#
# [[kv_namespaces]]
# binding = "CACHE"
# id = "paste-the-id-here"
# preview_id = "paste-the-preview-id-here"

# --- Optional settings ------------------------------------------------------
#
# ONE [vars] table only. TOML forbids the same table twice, so uncomment the
# header once and then whichever keys you need underneath it — two [vars] blocks
# make `wrangler deploy` fail with a duplicate-table error.
#
# RESOLVER_BASE_URL   Fallback extraction service. Only YouTube and Dailymotion
#                     use it; Bilibili, Facebook and Instagram never do. It may
#                     include a path (cPanel mounts apps on one) — that is
#                     preserved. See resolver-cpanel/ and resolver-server/.
# RESOLVER_BACKEND    "ytdlp" (default) or "cobalt".
# ENVIRONMENT         Label shown by /api/health.
# PROXY_TOKEN_TTL_SECONDS      Download-link lifetime, 60..21600. Default 1800.
# RATE_LIMIT_RESOLVE_PER_MINUTE  Per IP, 1..10000. Default 20. Needs KV.
#
# LIVE — active. The header must stay uncommented for the keys below it to be
# read as vars; bare keys under a commented header silently attach to whatever
# table appeared last. The build also parses RESOLVER_BASE_URL from here to add
# the resolver's origin to the page's Content-Security-Policy, so a value that
# is commented out disables the browser-direct download route too.
[vars]
RESOLVER_BASE_URL = "https://sectester.xyz/media-fetch_resolver"
RESOLVER_BACKEND = "ytdlp"

# Optional:
# ENVIRONMENT = "production"
# PROXY_TOKEN_TTL_SECONDS = "1800"
# RATE_LIMIT_RESOLVE_PER_MINUTE = "20"

# ---------------------------------------------------------------------------
# SECRETS — never in this file. `wrangler secret put NAME`, or the dashboard
# under Settings -> Variables and Secrets (required for Workers Builds CI,
# which cannot run the interactive command).
#
#   SIGNING_KEY      REQUIRED. 32+ random bytes: openssl rand -base64 48
#   RESOLVER_TOKEN   REQUIRED IF you run a resolver. Must match the resolver's
#                    own RESOLVER_TOKEN. It both authenticates /extract and is
#                    the HMAC key for /fetch, the endpoint that streams bytes
#                    from the resolver's IP. YouTube and Dailymotion URLs are
#                    signed against that IP, so without this they cannot be
#                    downloaded at all (error: ip_locked_url).
#   BILIBILI_COOKIE  optional. a SESSDATA value; lifts Bilibili's 480p
#                    anonymous ceiling to 1080p+
#   INSTAGRAM_COOKIE optional. unlocks gated posts and view counts
# ---------------------------------------------------------------------------
